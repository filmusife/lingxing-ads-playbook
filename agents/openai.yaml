interface:
  display_name: "领星广告调整手册 v2"
  short_description: "Stage-aware Lingxing + Xiyou (xydc-mcp) Amazon ads audit and full 13-section adjustment playbook (v2)"
  brand_color: "#1677FF"
  default_prompt: "Use $lingxing-ads-playbook to determine lifecycle stage & targets, audit my Amazon ads for ASIN <ASIN> on US via Lingxing MCP and Xiyou MCP (xydc-mcp), verify North-Star outcomes, and output the complete 13-section (including 0.0) product-fit adjustment playbook and conflict-free bulk TSV."

dependencies:
  tools:
    - type: "mcp"
      value: "lingxing-mcp"
      description: "Lingxing OpenMCP for Amazon ads, placement reports, listing, financial profit, and FBA reports"
      transport: "streamable_http"
      url: "https://openmcp.lingxing.com/mcp-servers/lingxing-mcp"
    - type: "mcp"
      value: "xydc-mcp"
      description: "Xiyou Data Insights MCP for organic/sponsored keyword ranks, ASIN & competitor traffic structure, parent 4-channel split, keyword count & BSR trends, and daily deal/price trends"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
